name: Release

# Builds the sdist + wheel on every PR, on manual runs and on version tags. Publishing uses PyPI
# trusted publishing (OIDC, no tokens) and uploads PEP 740 attestations automatically.
#   * push a tag `vX.Y.Z`                       -> PyPI (+ GitHub release)
#   * manual run with `publish: testpypi`       -> TestPyPI (version is the latest tag + .devN)
# Read the Docs reads .readthedocs.yaml from the *tagged commit*, so a tag with a broken docs setup
# can never be repaired afterwards (a published tag must not move). Hence for tags:
#   * `docs` validates that config and builds the docs BEFORE anything is published;
#   * `rtd` waits AFTER publishing for Read the Docs to build `stable` and fails the run if it did not.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Where to publish the built files"
        type: choice
        options: [none, testpypi]
        default: none

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # setuptools-scm needs tags
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Smoke test the wheel
        run: |
          uv venv .venv-wheel
          uv pip install --python .venv-wheel dist/*.whl
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/.venv-wheel/bin/python" -c "import menpo; print(menpo.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  docs:
    # also on manual runs, so a dry run exercises the gate too
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      READTHEDOCS: "True"   # as on Read the Docs: use the installed menpo
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - name: Validate the Read the Docs configuration against its schema
        run: uvx check-jsonschema --builtin-schema vendor.readthedocs .readthedocs.yaml
      - name: Install what Read the Docs installs
        run: |
          uv venv --python 3.13 .venv-docs
          uv pip install --python .venv-docs -r docs/requirements.txt ".[imageio,cyvlfeat]"
      - name: Build the docs
        run: .venv-docs/bin/python -m sphinx -b html -j auto docs/source docs/_build 2>&1 | tee docs-build.log
      - name: Autodoc must be able to import everything
        run: |
          if grep "autodoc: failed to import" docs-build.log; then exit 1; fi

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, docs]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # trusted publishing
      contents: write        # GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Tag must match the built version
        run: |
          test -f "dist/menpo-${GITHUB_REF_NAME#v}.tar.gz" \
            || { echo "tag ${GITHUB_REF_NAME} does not match built files:"; ls dist; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # PEP 440 pre-releases (a/b/rc/dev) must not become the "latest" GitHub release
          flags=()
          if [[ "$GITHUB_REF_NAME" =~ ([0-9](a|b|rc)[0-9]+|\.dev[0-9]+)$ ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${flags[@]}"

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
    needs: [build, docs]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  rtd:
    # An alert, not a gate (the files are already published): fails the run if Read the Docs did not
    # build the docs of this release, with a link to its build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Read the Docs build of `stable` (skipped for pre-releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .run_started_at)
          python3 .github/scripts/check_rtd_build.py --tag "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" --since "$since"
